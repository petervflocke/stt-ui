# Project scoped Codex config. Codex reads ~/.codex/config.toml and can also read
# a project file at .codex/config.toml for trusted projects. :contentReference[oaicite:1]{index=1}

[project]
project_root_markers = [".git", "docker-compose.yml", ".codex", "PROJECT_PLAN.md"]

[features]
child_agents_md = true

[context]
max_files = 300
include_hidden = false
follow_symlinks = false

[commands]
deploy = "make deploy"
smoke  = "make deploy && curl -fsS http://127.0.0.1:8010/api/health"
logs   = "make logs"

[frontend]
framework = "react"
bundle = "vite"
state_library = "none"
ui_framework = "none"
page_count = "single"
component_style = "few_simple_components"
architecture = "dumb_ui_plus_api_helper"
