services:
  stt-ui:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: stt-ui
    ports:
      - "8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8010"
      STT_API_BASE: "http://host.docker.internal:8001"
    restart: unless-stopped
