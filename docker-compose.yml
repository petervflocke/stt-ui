services:
  stt-ui:
    build:
      context: .
      dockerfile: pyserver/Dockerfile
    container_name: stt-ui
    ports:
      - "8010:8010"
    gpus: all
    environment:
      WHISPER_MODEL: "small"
      WHISPER_DEVICE: "cuda"
      WHISPER_COMPUTE_TYPE: "float16"
      MAX_UPLOAD_MB: "1024"
    restart: unless-stopped
