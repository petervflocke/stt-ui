services:
  stt-ui:
    build:
      context: .
      dockerfile: pyserver/Dockerfile
    container_name: stt-ui
    ports:
      - "8010:8010"
    gpus: all
    environment:
      WHISPER_MODEL: "small"
      WHISPER_DEVICE: "cuda"
      WHISPER_COMPUTE_TYPE: "float16"
      WHISPER_BEAM_SIZE: "3"
      WHISPER_VAD_FILTER: "true"
      MAX_UPLOAD_MB: "1024"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ctranslate2_cache:/root/.cache/ctranslate2
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import ctranslate2, urllib.request, json; c=ctranslate2.get_cuda_device_count(); assert c > 0, f'cuda_device_count={c}'; data=json.loads(urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5).read().decode()); assert data.get('status') == 'ok'; assert data.get('device') == 'cuda'"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  hf_cache:
  ctranslate2_cache:
